name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（例如 v1.2.3）；留空则自动生成 v0.0.0-<short-sha>"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="v0.0.0-${GITHUB_SHA::7}"
          fi
          case "${version}" in
            v*) ;;
            *) version="v${version}" ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          binary="imgpull"
          if [ "${GOOS}" = "windows" ]; then
            binary="imgpull.exe"
          fi
          mkdir -p dist
          ldflags="-s -w -X image-poller/cmd.Version=${VERSION}"
          go build -trimpath -ldflags "${ldflags}" -o "dist/${binary}" .

      - name: Package artifacts
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="imgpull_${GOOS}_${GOARCH}"
          cp README.md dist/README.md
          cd dist
          if [ "${GOOS}" = "windows" ]; then
            zip -q -9 "${name}.zip" imgpull.exe README.md
            rm -f imgpull.exe README.md
          else
            tar -czf "${name}.tar.gz" imgpull README.md
            rm -f imgpull README.md
          fi
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgpull-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum imgpull_* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
